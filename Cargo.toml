[package]
name = "photocraft_3d_preview"
version = "1.0.2"
edition = "2021"
authors = ["AjarinWeb"]
description = "Real-time 3D model texture previewer plugin for PhotoCraft internal sandbox ecosystem."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"     
lto = true          
panic = "abort"     
codegen-units = 1
strip = true
