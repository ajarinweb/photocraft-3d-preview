[package]
name = "photocraft_3d_preview"
version = "1.0.0"
edition = "2021"
authors = ["AjarinWeb"]
description = "Real-time 3D model texture previewer plugin for PhotoCraft internal sandbox ecosystem."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"     
lto = true          
panic = "abort"     
codegen-units = 1

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
