name: Build and Release WASM Plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Compile WASM Plugin
      env:
        RUSTFLAGS: "-C link-arg=--strip-all" 
      run: cargo build --target wasm32-unknown-unknown --release

    - name: Prepare Assets
      run: |
        mkdir release-assets
        cp target/wasm32-unknown-unknown/release/photocraft_3d_preview.wasm release-assets/photocraft_3d_preview.wasm

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/photocraft_3d_preview.wasm
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
